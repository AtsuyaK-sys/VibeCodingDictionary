<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サウンド・効果音辞典 | Vibe Coding 辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">

<style>
  .snd{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:16px; }
  .snd-play{ width:56px; height:56px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:20px; cursor:pointer; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); transition:transform .1s; padding-left:4px; }
  .snd-play:hover{ transform:scale(1.06); }
  .snd-play:active{ transform:scale(.94); }
  .snd-play.on{ animation:sndPulse .5s ease-out; }
  @keyframes sndPulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100%{ box-shadow:0 0 0 22px transparent; } }
  .snd-wave{ width:90px; height:30px; background:repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent) 0 3px, transparent 3px 7px); -webkit-mask:linear-gradient(90deg, #000, #0008); mask:radial-gradient(ellipse at center, #000 30%, transparent 75%); opacity:.6; }
  .snd-notes{ font:700 13px var(--font); color:var(--muted); }
  .snd-keys{ display:flex; gap:3px; }
  .snd-keys i{ width:14px; height:34px; border-radius:3px; background:var(--surface); border:1px solid var(--border-strong); transition:background .1s, transform .1s; }
  .snd-keys i.on{ background:var(--accent); transform:translateY(2px); }
  .snd-btn{ border:0; background:var(--accent); color:#fff; font:700 12.5px var(--font); padding:7px 14px; border-radius:9px; cursor:pointer; }
  .snd-btn.ghost{ background:var(--surface); color:var(--text); border:1px solid var(--border); font-weight:500; }
  .snd-grid{ position:absolute; inset:10px; display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .snd-w{ border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--text); font-family:var(--font); }
  .snd-w:hover{ border-color:var(--accent); }
  .snd-w canvas{ width:100%; height:44px; }
  .snd-w small{ font:600 10px var(--mono); color:var(--accent); }
  .snd-w span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.4; }
  @media (max-width:640px){ .snd-grid{ grid-template-columns:1fr 1fr; } .snd-w span{ display:none; } }
  .snd-adsr{ position:absolute; inset:10px 16px; display:flex; flex-direction:column; gap:6px; justify-content:center; }
  .snd-adsr svg{ height:70px; width:100%; background:var(--surface); border-radius:10px; border:1px solid var(--border); }
  .snd-adsr polyline{ fill:color-mix(in srgb, var(--accent) 18%, transparent); stroke:var(--accent); stroke-width:2; }
  .snd-sl{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .snd-sl label{ display:flex; align-items:center; gap:4px; font:700 11px var(--mono); }
  .snd-sl input{ width:100%; accent-color:var(--accent); }
  .snd-adsr .snd-btn{ align-self:flex-start; }
  .snd-metro{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .snd-metro .beats{ display:flex; gap:10px; }
  .snd-metro .beats i{ width:16px; height:16px; border-radius:50%; background:var(--surface); border:2px solid var(--border-strong); }
  .snd-metro .beats i.on{ background:var(--accent); border-color:var(--accent); }
  .snd-metro label{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .snd-metro .bpm{ font:800 22px var(--mono); }
  .snd-metro .tname{ font-size:12px; color:var(--muted); }
  .snd-metro label{ flex-wrap:wrap; justify-content:center; max-width:92%; }
  .snd-metro input{ min-width:0; width:120px; }
  /* 大きく拡大したとき（画面幅がとても狭いとき）は鍵盤とボタンを詰める */
  @media (max-width:360px){
    .snd{ gap:10px; }
    .snd-play{ width:46px; height:46px; font-size:17px; }
    .snd-keys{ gap:2px; }
    .snd-keys i{ width:10px; }
  }
  .snd-seq{ position:absolute; inset:10px 12px; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  .snd-seq .r{ display:grid; grid-template-columns:62px repeat(16, 1fr); gap:3px; align-items:center; }
  .snd-seq .r span{ font-size:11px; font-weight:700; color:var(--muted); }
  .snd-seq .r button{ height:24px; border-radius:4px; border:1px solid var(--border); background:var(--surface); cursor:pointer; padding:0; }
  .snd-seq .r button.q{ background:color-mix(in srgb, var(--stage-ink) 8%, var(--surface)); }
  .snd-seq .r button.on{ background:var(--accent); border-color:var(--accent); }
  .snd-seq .r button.now{ outline:2px solid #facc15; outline-offset:-1px; }
  .snd-seq .ctl{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .snd-seq .ctl label{ display:flex; gap:6px; align-items:center; font-size:12px; margin-right:6px; }
  .snd-seq .ctl input{ width:90px; accent-color:var(--accent); }
  .snd-seq .ctl b{ font:700 12px var(--mono); width:26px; }
</style>
</head>
